services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infraos
      POSTGRES_PASSWORD: infraos
      POSTGRES_DB: infraos
    volumes:
      - infraos_postgres_data:/var/lib/postgresql/data
    ports:
      - "2001:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infraos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "2002:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://infraos:infraos@postgres:5432/infraos
      REDIS_URL: redis://redis:6379/0
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      METRICS_POLL_INTERVAL_SECONDS: ${METRICS_POLL_INTERVAL_SECONDS:-30}
      DIGITAL_TWIN_CACHE_TTL_SECONDS: ${DIGITAL_TWIN_CACHE_TTL_SECONDS:-20}
      CORS_ORIGINS: '["http://localhost:2030","http://localhost:2020"]'
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-480}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-me-immediately}
      SECRETS_BACKEND: ${SECRETS_BACKEND:-fernet}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_MOUNT_POINT: ${VAULT_MOUNT_POINT:-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "2010:2010"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "2020:2020"

  # Optional: uncomment to run a local Vault dev server and set
  # SECRETS_BACKEND=vault / VAULT_ADDR=http://vault:8200 / VAULT_TOKEN=dev-root-token
  # in .env. Dev mode is NOT suitable for production Vault use (unsealed,
  # in-memory, root-token auth) — it exists here only to make the Vault
  # secrets backend easy to try locally.
  # vault:
  #   image: hashicorp/vault:1.15
  #   cap_add:
  #     - IPC_LOCK
  #   environment:
  #     VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
  #     VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
  #   ports:
  #     - "2100:8200"

volumes:
  infraos_postgres_data:
